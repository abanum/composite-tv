CompositeTV.AgcLevel="Detection level (AGC)"
CompositeTV.AgcLevel.Tip="Average darkness of the snow.\nHigher = darker, lower = whiter (NTSC is negative modulation).\nHas almost no effect above field strength 0.35."
CompositeTV.AgcJitter="AGC hunting"
CompositeTV.AgcJitter.Tip="Instability of the receiver's AGC loop.\nThe AGC keys on its own line timing, measures sync tip against\nback porch and turns the gain to hold that steady.\nRaising this makes the loop's damping negative: the brightness\npumps at about 8 Hz.\nAt 0 the physics is still live:\n- the bright streak after a long dropout\n- the dip to dark before the snow winds up when the signal vanishes\n- the white flash when it returns"
CompositeTV.HHold="Horizontal hold slop (H-HOLD)"
CompositeTV.HHold.Tip="A receiver-side knob detuning the line oscillator.\nCentre = lock, sign = direction.\nUp to about +-0.3: the picture parks off-centre and starts to weave\n  (the AFC's stability margin)\nAround +-0.4: horizontal hold is lost and the raster tears diagonally\nFurther: more copies wrap the screen barber-pole style\nHappens on a clean signal too."
CompositeTV.VHold="Vertical hold slop (V-HOLD)"
CompositeTV.VHold.Tip="A receiver-side knob detuning the field oscillator (centre = lock).\nA triggered oscillator as in the real sets, so it lets go asymmetrically:\nToward fast: past about +0.5 it fires before the pulse arrives and\n  the frame rolls smoothly, faster the further you turn\nToward slow: it holds until about -0.65, then misses the trigger and\n  rolls the other way in jerks\nWhen snow drowns the vertical pulses it free-runs and rolls slowly."
CompositeTV.IfBandwidth="IF bandwidth (MHz)"
CompositeTV.IfBandwidth.Tip="Bandwidth of the noise = grain size of the snow.\nNarrow (2.0): coarse grains stretched sideways\nWide (7.0): fine, sandy grain"

CompositeTV.LumaBandwidth="Video bandwidth / LPF (MHz)"
CompositeTV.ChromaGain="Chroma gain"
CompositeTV.ColorKiller="Color killer"
CompositeTV.ColorKiller.Auto="Auto (burst detection - as the real circuit)"
CompositeTV.ColorKiller.Off="Off (always pass colour)"
CompositeTV.ColorKiller.Force="Force monochrome"
CompositeTV.ChromaDrift="Subcarrier phase drift (rad/s)"
CompositeTV.ChromaDrift.Tip="How fast the hue rotates while the receiver cannot lock to the burst.\nNo effect while the burst is detectable.\nWith the colour killer Off you can watch the snow's colour noise turn."
CompositeTV.Contrast="Contrast"
CompositeTV.Brightness="Brightness"

CompositeTV.Glitch="Glitches (reception faults)"
CompositeTV.GlitchFieldStrength="Field strength while active"
CompositeTV.GlitchFieldStrength.Tip="Replaces the main field strength while this group is live.\nLive = ticked, or for the burst length after a Reception trigger.\n\nHow to use it:\nLeave the box off and set up here what kind of reception fault\nyou want and how much. The trigger starts the group at full strength\nand lets it recover log-style back to the main settings;\nthe receiver's physics (colour killer, horizontal and vertical hold\nlosing and regaining lock) does the rest."
CompositeTV.GlitchHHold="H-HOLD while active"
CompositeTV.GlitchHHold.Tip="Replaces the main H-HOLD while the group is live.\nBeyond +-0.4 the trigger loses horizontal hold - the raster tears\ndiagonally, then weaves back into lock as it recovers."
CompositeTV.GlitchVHold="V-HOLD while active"
CompositeTV.GlitchVHold.Tip="Replaces the main V-HOLD while the group is live.\nPast +0.5 a smooth roll, below -0.65 a jerky reverse roll.\nAs the value recovers the frame snaps back into lock within a roll."
CompositeTV.Peaking="Ringing"
CompositeTV.Peaking.Tip="Resonance of the video amplifier's high-frequency boost:\na wavy tail to the right of vertical edges.\nLower the video bandwidth / LPF to make it stronger."
CompositeTV.GhostGain="Ghost amount (multipath)"
CompositeTV.GhostGain.Tip="A multipath image from a delayed reflection.\nAdded before Y/C separation, so it smears colour like a real ghost."
CompositeTV.GhostDelay="Ghost delay (samples, negative = leading)"
CompositeTV.GhostDelay.Tip="How far the ghost is displaced (samples; one line = 910).\nNegative = a leading ghost (a reflection arriving before the main path)."
CompositeTV.HJitter="Horizontal sync jitter"
CompositeTV.HJitter.Tip="The transmitter's timebase shaking line by line (sync pulse and all).\nThe receiver-side shake already emerges from noise in the separator,\nso this knob is for 'clean signal, shaky sender'."
CompositeTV.Fading="Fading (signal rise and fall)"
CompositeTV.Fading.Tip="The signal's rise and fall dips the effective field strength:\na slow swell (duct, scatter, polarization)\n+ a seconds-scale two-ray beat\n+ fine scintillation.\nDeep interference troughs raise a ghost - multipath is what a trough is.\nPair with field strength 0.55-0.7 to see it."
CompositeTV.Flagging="Flagging (top-of-picture bend, negative = right)"
CompositeTV.Flagging.Tip="Tape-tension error bending only the top of the picture (the VTR classic).\nPositive = left, negative = right.\nColour-under style, so the hue stays put."
CompositeTV.FlagWave="Flagwaving (tension wobble)"
CompositeTV.FlagWave.Tip="Wandering tension: the bend's direction and size slowly wave (flagwaving)."
CompositeTV.HeadSwitch="Head switching tear (bottom)"
CompositeTV.HeadSwitch.Tip="Timebase error and RF dropout at the head-switch point (bottom lines).\nThe bottom edge tears into a noise band (VHS)."
CompositeTV.Dropout="Tape dropout (white streaks)"
CompositeTV.Dropout.Tip="How often the tape loses signal.\n0.05 is a good tape, 0.3 a worn one.\nLong dropouts take the sync with them: the horizontal is upset\nright after, and the AGC winds up leaving a bright streak."
CompositeTV.DropoutMode="Dropout compensator"
CompositeTV.DropoutMode.None="None (white streaks)"
CompositeTV.DropoutMode.Grey="Grey level restorer"
CompositeTV.DropoutMode.Delay="1H delay line (repeat last line)"
CompositeTV.TapeDamage="Tape damage (crease / scratch)"
CompositeTV.TapeDamage.Tip="A crease or scratch on the tape; the signal drops out where it lands.\nPlace it with 'position', move it with 'drift'."
CompositeTV.TapeDamagePos="Tape damage position"
CompositeTV.TapeDamageDrift="Tape damage drift (screens/s)"
CompositeTV.TapeDamageDrift.Tip="Speed at which the damaged band crawls through the picture\n(screens/s, negative = reverse).\nTape travel and drum rotation never keep exact step.\nA Playback trigger adds one full sweep on top."
CompositeTV.BeatGain="Interference beat (herringbone)"
CompositeTV.BeatGain.Tip="Beat with an adjacent or co-channel carrier (herringbone).\nSet the frequency near 3.58 MHz for rainbow cross-colour."
CompositeTV.BeatFreq="Interference frequency (MHz)"
CompositeTV.BurstLen="Burst length (seconds)"
CompositeTV.BurstLen.Tip="How long a Reception trigger keeps the group live.\nIt starts at full strength and recovers log-style over this time."
CompositeTV.Playback="Glitches (playback faults)"
CompositeTV.SweepSec="Seconds for tape damage to cross the screen"
CompositeTV.SweepSec.Tip="How long a Playback trigger takes the tape damage right across the picture.\nThe trigger lasts exactly that long."
