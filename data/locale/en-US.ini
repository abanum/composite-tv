CompositeTV.FieldStrength="Field strength (0 = snow)"
CompositeTV.FieldStrength.Tip="Received field strength - the main control of this filter.\n1.0 = clean, 0.7-0.55 = grainy to weak, 0 = pure snow.\nThere is a detection cliff near 0.5; below it the picture sinks fast.\nIn a weak field the sync separator loses to noise and the horizontal\nswims; once the burst drowns the colour killer drops the colour."
