CompositeTV.AudioCarrierGain="Sound carrier level"
CompositeTV.AudioCarrierGain.Tip="0.1 matches the real thing.\nIt rides in the signal itself, so the normal display shows it as\nfine 4.5 MHz dots (the decoder has no trap)."
CompositeTV.Signal.Hint="The signal is also always available through the 'Composite TV Signal' source (Add Source, then pick this filter in it). Put a Spout Filter on that source to send while adjusting the CRT picture here. With any format other than None, this filter's own output becomes the raw 910x264 signal. The bottom row is a header (magic, field number and so on)."
CompositeTV.Signal.SourceName="Composite TV Signal"
CompositeTV.Signal.Target="Signal from (Composite TV filter)"
CompositeTV.Signal.Target.None="(not selected)"
CompositeTV.Signal.SourceHint="Shows the chosen Composite TV filter's raw composite signal (910x264, 16-bit R+G) as a source of its own. Put obs-spout2-plugin's Spout Filter on this source to hand the signal to an outside app 1:1 while adjusting the CRT picture on the filter. The source carrying that filter must be rendering (visible in some scene)."

CompositeTV.Scope="Debug: overlay the NTSC waveform"
CompositeTV.Scope.Tip="Overlays the detected composite signal of one scan line.\nThe traced line is marked in red on the picture.\nGreen = waveform, amber = horizontal AFC phase, cyan = separator trust,\nmagenta = AGC gain."
CompositeTV.ScopeLine="Debug: scan line to trace (0-485)"
