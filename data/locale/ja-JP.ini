CompositeTV.AudioCarrierGain="音声搬送波の強さ"
CompositeTV.AudioCarrierGain.Tip="実機相当は 0.1。\n信号に直接乗るため、通常表示では 4.5MHz の細かい点模様として\n見えます（デコーダにトラップが無いため）。"
CompositeTV.Signal.Hint="信号は常に「コンポジットTV 信号」ソースからも取り出せます（ソースの追加 → コンポジットTV 信号 → このフィルタを選択）。そちらに Spout Filter を付ければ、ブラウン管表示のまま調整しながら送れます。出力形式を「なし」以外にすると、このフィルタ自身の出力が 910×264 の信号になります。最下行はヘッダ（マジック・フィールド番号など）です。"
CompositeTV.Signal.SourceName="コンポジットTV 信号"
CompositeTV.Signal.Target="信号の取り出し元 (コンポジットTVフィルタ)"
CompositeTV.Signal.Target.None="（未選択）"
CompositeTV.Signal.SourceHint="選んだコンポジットTVフィルタのコンポジット信号（910×264・16bit R+G）をそのまま表示するソースです。obs-spout2-plugin の「Spout Filter」をこのソースに付けると、フィルタ側でブラウン管表示を調整しながら信号を外部アプリへ 1:1 で送れます。取り出し元のフィルタが付いたソースが描画されている（どこかのシーンで表示中）必要があります。"

CompositeTV.Scope="デバッグ: NTSC波形を合成"
CompositeTV.Scope.Tip="指定した走査線の検波後コンポジット信号を画面に重ねます。\n対象ラインは赤くマークされます。\n緑 = 波形、アンバー = 水平 AFC の位相、シアン = 分離器の信頼度、\nマゼンタ = AGC 利得。"
CompositeTV.ScopeLine="デバッグ: 波形を見る走査線 (0〜485)"
