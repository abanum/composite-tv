CompositeTV.FieldStrength="電界強度 (0=砂嵐)"
CompositeTV.FieldStrength.Tip="受信電界の強さ。このフィルタの主役です。\n1.0 = クリア、0.7〜0.55 = ざらつき〜弱電界、0 = 完全な砂嵐。\n0.5 付近に検波の崖があり、それより下では急に砂に沈みます。\n弱電界では同期分離器が雑音に負けて水平が泳ぎ、\nバーストが沈むとカラーキラーが色を落とします。"
CompositeTV.NoiseFloor="最小雑音 (残る粒)"

