CompositeTV.AgcLevel="検波レベル (AGC)"
CompositeTV.AgcLevel.Tip="砂嵐の平均的な暗さです。\n上げるほど暗く、下げるほど白っぽくなります（NTSC は負変調のため）。\n電界強度 0.35 以上ではほぼ効きません。"
CompositeTV.AgcJitter="AGCハンチング"
CompositeTV.AgcJitter.Tip="受像機の AGC ループの不安定さです。\nAGC は自前の同期タイミングで同期先端とバックポーチを測り、\nその差を一定に保つように利得を回しています。\n上げるとループの減衰が負になり、約 8Hz で明るさが脈打ちます。\n0 でも物理は生きています:\n・長いドロップアウトの後の白い筋\n・電波が消えた瞬間の暗転 → 砂嵐の立ち上がり\n・電波が戻った瞬間の白飛び"
CompositeTV.HHold="水平同期の甘さ (H-HOLDずれ)"
CompositeTV.HHold.Tip="受像機側のツマミで、水平発振器の周波数をずらします。\n中央＝ロック、符号＝ずれの向き。可動範囲は約 ±1500Hz。\n実機の水平AFC IC（LM1391）の規格値から寸法を取っています:\n・±0.77 くらいまでロック（ホールド範囲 ±900Hz）\n・限界の手前で絵が横に寄る（静的位相誤差 300Hz で 0.5µs）\n・その手前で蛇行が出る（ループが不安定側に入る）\n・外れると 59.94Hz のずれにつき斜めコピー1本\n電波がきれいでも起こります。"
CompositeTV.VHold="垂直同期の甘さ (V-HOLDずれ)"
CompositeTV.VHold.Tip="受像機側のツマミで、垂直発振器の周波数をずらします（中央＝ロック）。\n実機の垂直偏向IC（TDA1170）の規格値から寸法を取っています:\n自走は場周波数より遅い 54Hz、同期パルスはランプを最大100行早く\n発火させられるので、43Hz〜59.94Hz の広い範囲でロックします。\nトリガは片側にしか効かないため外れ方は非対称です:\n・＋側は +0.55 付近で自走が場周波数を追い越し、滑らかに回転\n・−側は −0.85 付近まで粘り、そこから逆方向にガクガク回転\n弱電界では発火の取りこぼしで画面が上下に跳ね、さらに悪化すると回ります。"
CompositeTV.IfBandwidth="IF帯域幅 (MHz)"
CompositeTV.IfBandwidth.Tip="雑音を帯域制限する幅＝砂嵐の粒の細かさ。\n狭い（2.0）: 粒が横に伸びて粗く流れる\n広い（7.0）: 細かいザラザラ"

CompositeTV.LumaBandwidth="映像帯域 / LPF (MHz)"
CompositeTV.ChromaGain="クロマゲイン"
CompositeTV.ColorKiller="カラーキラー"
CompositeTV.ColorKiller.Auto="自動 (バースト検出 — 実機動作)"
CompositeTV.ColorKiller.Off="切 (常に色を通す)"
CompositeTV.ColorKiller.Force="強制モノクロ"
CompositeTV.ChromaDrift="副搬送波位相ドリフト (rad/s)"
CompositeTV.ChromaDrift.Tip="受像機がバーストにロックできないときの色相の回転速度。\nバーストが検出できる間は効きません。\nカラーキラーを「切」にすると、砂嵐の色ノイズが回るのが見えます。"
CompositeTV.Contrast="コントラスト"
CompositeTV.Brightness="ブライトネス"

CompositeTV.Glitch="グリッチ（受信不良の演出）"
CompositeTV.GlitchFieldStrength="発動中の電界強度"
CompositeTV.GlitchFieldStrength.Tip="このグループが有効なあいだ、メインの電界強度の代わりに使われます。\n有効＝チェック ON、または「受信不良」発動後の「一時発動の長さ」。\n\n使い方:\n普段はチェックを OFF にしておき、ここで「どんな受信不良を\nどれくらい起こすか」を決めておきます。発動するとグループの設定が\n設定値いっぱいで効き始め、対数的にメインの状態へ戻ります。\nあとは受像機の物理（カラーキラー、水平・垂直同期の喪失と復帰）\nに任せます。"
CompositeTV.GlitchHHold="発動中の H-HOLD"
CompositeTV.GlitchHHold.Tip="グループが有効なあいだ、メインの H-HOLD の代わりに使われます。\n±0.77 を超える値にすると、発動時に水平同期が外れて\n斜めに引き裂かれ、回復とともに蛇行を経てロックし直します。"
CompositeTV.GlitchVHold="発動中の V-HOLD"
CompositeTV.GlitchVHold.Tip="グループが有効なあいだ、メインの V-HOLD の代わりに使われます。\n+0.55 超で滑らかな縦回転、−0.85 未満でガクガクした逆回転。\n回復で値が戻ると 1 回転以内にパチンとロックします。"
CompositeTV.Peaking="リンギング"
CompositeTV.Peaking.Tip="映像アンプの高域持ち上げの共振。縦エッジの右に波状の尾が残ります。\n効果を強くしたい場合は「映像帯域 / LPF」を下げてください。"
CompositeTV.GhostGain="ゴースト強度 (多重反射)"
CompositeTV.GhostGain.Tip="遅れて届いた反射波による多重像。\nY/C 分離の前に足されるので、色にじみを伴う本物らしい\nゴーストになります。"
CompositeTV.GhostDelay="ゴースト遅延 (サンプル/負=先行)"
CompositeTV.GhostDelay.Tip="ゴーストのずれる距離（サンプル単位、1 ライン = 910）。\n負の値で先行ゴースト（主波より早く届く反射）。"
CompositeTV.HJitter="水平同期ジッタ"
CompositeTV.HJitter.Tip="送出側のタイムベースが行ごとに揺れます（同期パルスごと）。\n受像機側の揺れは砂嵐で分離器の雑音から自然に出るので、\nこのノブは「電波はきれいなのに送り手が揺れている」場合用です。"
CompositeTV.Fading="フェージング (電波の浮き沈み)"
CompositeTV.Fading.Tip="電波の浮き沈みで実効電界強度が沈み込みます。\n長周期のうねり（ダクト・散乱・偏波）\n＋ 数秒周期の干渉ビート\n＋ 細かいシンチレーション\nの合成です。干渉性の深い谷では多重伝搬＝ゴーストが立ちます。\n電界強度 0.55〜0.7 と併用すると効果が見えやすいです。"
CompositeTV.Flagging="フラッギング (上部の曲がり / 負=右)"
CompositeTV.Flagging.Tip="テープ張力の誤差による、画面上部だけの横曲がり（VTR の定番）。\n正 = 左、負 = 右。\nカラーアンダー相当なので色相は安定したままです。"
CompositeTV.FlagWave="フラッギング揺らぎ (旗めき)"
CompositeTV.FlagWave.Tip="張力の揺らぎで、曲がりの向きと量がゆっくり波打ちます（旗めき）。"
CompositeTV.HeadSwitch="ヘッドスイッチング (下部の乱れ)"
CompositeTV.HeadSwitch.Tip="ヘッド切り替え点（画面下部数ライン）の時間軸誤差と RF の途切れ。\n下端が千切れてノイズ帯になります（VHS）。"
CompositeTV.Dropout="ドロップアウト (白い横筋)"
CompositeTV.Dropout.Tip="テープの信号欠落の発生頻度。\n0.05 で良好なテープ、0.3 で劣化テープ相当。\n長い欠落は同期も消すので、直後に水平が乱れ、\nAGC が巻き上がって白っぽい筋が残ります。"
CompositeTV.DropoutMode="ドロップアウト補償"
CompositeTV.DropoutMode.None="なし (白飛び)"
CompositeTV.DropoutMode.Grey="グレー補間"
CompositeTV.DropoutMode.Delay="1H遅延線 (直前のラインで埋める)"
CompositeTV.TapeDamage="テープ傷 (折れ・縦傷)"
CompositeTV.TapeDamage.Tip="テープの折れ・縦傷。傷の当たる帯で信号が欠落します。\n位置は「テープ傷の位置」、帯の移動は「移動速度」で。"
CompositeTV.TapeDamagePos="テープ傷の位置"
CompositeTV.TapeDamageDrift="テープ傷の移動速度 (画面/秒)"
CompositeTV.TapeDamageDrift.Tip="傷の帯が画面を這う速度（画面/秒、負で逆方向）。\nテープの走行とドラムの回転がぴったり同期しないために起きます。\n「再生不良」発動中は、これに加えて 1 周ぶん掃引します。"
CompositeTV.BeatGain="干渉ビート強度 (斜め縞)"
CompositeTV.BeatGain.Tip="隣接／同一チャンネルの搬送波とのビート（斜め縞）。\n周波数を 3.58MHz 付近にすると虹色のクロスカラーになります。"
CompositeTV.BeatFreq="干渉ビート周波数 (MHz)"
CompositeTV.BurstLen="一時発動の長さ (秒)"
CompositeTV.BurstLen.Tip="「受信不良」発動でグループが効いている秒数。\n設定値いっぱいで始まり、この時間で対数的に戻ります。"
CompositeTV.Playback="グリッチ（再生不良の演出）"
CompositeTV.SweepSec="テープ傷が1画面動く時間 (秒)"
CompositeTV.SweepSec.Tip="「再生不良」の一時発動で、テープ傷が画面を 1 周する時間です。\n発動もこの長さだけ続きます。"
